<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>你好，VS Code · 我的第一个项目</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e1b4b;
      --accent: #38bdf8;
      --accent-2: #a855f7;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-1));
      background-size: 200% 200%;
      animation: gradientMove 12s ease infinite;
      overflow-x: hidden;
    }

    @keyframes gradientMove {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* 背景光斑 */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }
    .blob.one {
      width: 340px; height: 340px;
      background: var(--accent);
      top: -80px; left: -80px;
      animation: float 9s ease-in-out infinite;
    }
    .blob.two {
      width: 300px; height: 300px;
      background: var(--accent-2);
      bottom: -90px; right: -70px;
      animation: float 11s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -30px); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      padding: 48px 40px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      animation: riseIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      margin-bottom: 22px;
      font-size: 13px;
      letter-spacing: 0.5px;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 999px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 52px);
      line-height: 1.25;
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 5s linear infinite;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    .subtitle {
      margin-top: 8px;
      font-size: clamp(18px, 3vw, 24px);
      font-weight: 600;
      color: var(--text);
    }

    .desc {
      margin-top: 20px;
      font-size: 16px;
      line-height: 1.8;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-top: 34px;
    }

    button {
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 13px 28px;
      border-radius: 999px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.2s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .btn-primary {
      color: #05121f;
      background: linear-gradient(135deg, var(--accent), #7dd3fc);
      box-shadow: 0 10px 26px rgba(56, 189, 248, 0.35);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 34px rgba(56, 189, 248, 0.5);
    }

    .btn-ghost {
      color: var(--text);
      background: transparent;
      border-color: var(--border);
    }
    .btn-ghost:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.08);
    }

    button:active { transform: translateY(0) scale(0.98); }

    .message {
      min-height: 26px;
      margin-top: 24px;
      font-size: 15px;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .message.show { opacity: 1; }

    .clock {
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    @media (max-width: 560px) {
      .card { padding: 34px 22px; border-radius: 20px; }
      .actions { flex-direction: column; }
      button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="blob one"></div>
  <div class="blob two"></div>

  <main class="card">
    <span class="badge">✨ 我的第一个项目</span>
    <h1>你好，VS Code</h1>
    <p class="subtitle">欢迎来到我的第一个项目</p>
    <p class="desc">
      这是我用 HTML、CSS 和 JavaScript 写下的第一个网页。<br />
      从今天开始，一点一点把它变得更酷吧！
    </p>

    <div class="actions">
      <button class="btn-primary" id="helloBtn">跟我打个招呼 👋</button>
      <button class="btn-ghost" id="themeBtn">切换氛围色</button>
    </div>

    <p class="message" id="message"></p>

    <p class="clock" id="clock">加载中…</p>
  </main>

  <script>
    const helloBtn = document.getElementById('helloBtn');
    const themeBtn = document.getElementById('themeBtn');
    const message = document.getElementById('message');
    const clock = document.getElementById('clock');
    const root = document.documentElement;

    const greetings = [
      '你好，世界！🌏',
      '你好，VS Code！💙',
      'Hello, World! 🚀',
      '代码写起来，梦想跑起来！✨'
    ];
    let index = 0;

    helloBtn.addEventListener('click', () => {
      message.textContent = greetings[index];
      message.classList.add('show');
      index = (index + 1) % greetings.length;
    });

    const themes = [
      ['#38bdf8', '#a855f7'],
      ['#22d3ee', '#34d399'],
      ['#fb7185', '#fbbf24'],
      ['#818cf8', '#f472b6']
    ];
    let themeIndex = 0;

    themeBtn.addEventListener('click', () => {
      themeIndex = (themeIndex + 1) % themes.length;
      const [a, b] = themes[themeIndex];
      root.style.setProperty('--accent', a);
      root.style.setProperty('--accent-2', b);
    });

    function updateClock() {
      const now = new Date();
      clock.textContent = '现在时间：' + now.toLocaleString('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
